<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chinese Signals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <span class="brand-mark">◄</span>
          <span class="brand-text">Chinese Signals</span>
        </div>
        <div class="top-icons">
          <span class="icon-circle">⌁</span>
          <span class="icon-circle">⚡</span>
          <span class="icon-circle">◌</span>
        </div>
      </header>

      <main class="dashboard">
        <section class="hero-card glass-panel">
          <div class="avatar-wrap">
            <div class="bot-avatar">
              <div class="antenna"></div>
              <div class="face">
                <div class="eye left"></div>
                <div class="eye right"></div>
                <div class="mouth"></div>
              </div>
            </div>
          </div>

          <div class="title-block">
            <h1>Chinese Signals</h1>
            <div class="badge-row">
              <span class="mini-badge">AI BOT</span>
              <span class="mini-badge accent">PRO MAX</span>
            </div>
          </div>
        </section>

        <section class="status-row glass-panel">
          <div class="status-item">
            <div class="status-icon shield">
              <span>✓</span>
            </div>
            <div class="status-copy">
              <small>LICENSE STATUS</small>
              <strong>ACTIVE</strong>
            </div>
          </div>

          <div class="status-item">
            <div class="status-icon online">
              <span>◔</span>
            </div>
            <div class="status-copy">
              <small>AI ENGINE STATUS</small>
              <strong>ONLINE</strong>
            </div>
          </div>

          <div class="status-item">
            <div class="status-icon users">
              <span>◌</span>
            </div>
            <div class="status-copy">
              <small>ACTIVE USERS</small>
              <strong>1M+</strong>
            </div>
          </div>
        </section>

        <div class="membership-banner glass-panel">
          <span class="crown">♛</span>
          <span>PRO MAX UNLOCKED</span>
          <span class="lock">◉</span>
        </div>

        <section class="signal-panel glass-panel">
          <h2>GENERATING SIGNALS</h2>
          <p>
            Please wait while our AI analyzes the market and finds the best
            opportunity...
          </p>

          <div class="signal-loader">
            <div class="ring ring-1"></div>
            <div class="ring ring-2"></div>
            <div class="ring ring-3"></div>
            <div class="center-core">
              <div class="play-button">
                <span>▶</span>
              </div>
            </div>
          </div>
        </section>

        <div class="bottom-bar">
          <button class="search-btn">⌕ Search this image</button>
        </div>

        <div class="countdown-wrap">
          <div class="mini-label">Please wait...</div>
          <div id="countdown" class="countdown">00:05</div>
        </div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
